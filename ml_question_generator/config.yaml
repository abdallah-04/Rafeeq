project:
  name: rafeeq-question-generator
  version: rafeeq-qg-v0.1
  seed: 42
model:
  name: google/mt5-small
  max_input_length: 512
  max_target_length: 512
training:
  epochs: 5
  learning_rate: 0.00005
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  early_stopping_patience: 1
generation:
  max_retries: 2
  max_new_tokens: 512
