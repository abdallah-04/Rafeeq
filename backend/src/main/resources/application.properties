spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rafeeq}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:bXktdmVyeS1zZWNyZXQta2V5LWZvci1yYWZlZXEtYXBwbGljYXRpb24tMTIzNDU2Nzg5MDEyMzQ1Ng==}
jwt.expiration=86400000
jwt.refresh-expiration=2592000000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}

server.port=8080
