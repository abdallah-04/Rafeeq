# LEGACY v0.2 configuration retained for old scripts/reproducibility. Active v0.4 uses config_v04.yaml.
project:
  name: rafeeq-question-generator
  version: rafeeq-qg-v0.2
  seed: 42
model:
  name: google/mt5-small
  output_name: rafeeq-mt5-qg-v0.2
  max_input_length: 96
  max_target_length: 160
training:
  epochs: 5
  learning_rate: 0.00005
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  early_stopping_patience: 1
  fp16: false
generation:
  max_retries: 2
  max_new_tokens: 160
